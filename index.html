<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400,700&display=swap" rel="stylesheet">

    <title>interactive-rating-component</title>
  </head>

  <body class="bg-grey-950 min-h-screen flex 
  justify-center items-center p-3 font-overpass">

  <main class="bg-grey-900 w-full max-w-103 p-8
 rounded-3xl text-left">

    <article class="main-rating-part">

      <img class="bg-grey-950/30 p-2 rounded-full "
       src="/images/icon-star.svg"
      alt="">

      <h1 class="text-white mt-3 text-xl ">How did we do?</h1>

      <p class="mt-3 text-grey-500 text-[15px]
      leading-6 tracking-normal w-full ">  Please let us know how we did with your support request. All feedback is appreciated 
  to help us improve our offering!</p>


<div class="mt-4 flex justify-center gap-2">
  <button
    type="button"
    class="rating-btn flex-1 aspect-square min-w-0 rounded-full
    bg-white/10 text-white/60
    hover:bg-orange-500 hover:text-grey-900
    cursor-pointer transition
    focus:outline-none focus:ring-2 focus:ring-orange-500"
  >1</button>

  <button
    type="button"
    class="rating-btn flex-1 aspect-square min-w-0 rounded-full
    bg-white/10 text-white/60
    hover:bg-orange-500 hover:text-grey-900
    cursor-pointer transition
    focus:outline-none focus:ring-2 focus:ring-orange-500"
  >2</button>

  <button
    type="button"
    class="rating-btn flex-1 aspect-square min-w-0 rounded-full
    bg-white/10 text-white/60
    hover:bg-orange-500 hover:text-grey-900
    cursor-pointer transition
    focus:outline-none focus:ring-2 focus:ring-orange-500"
  >3</button>

  <button
    type="button"
    class="rating-btn flex-1 aspect-square min-w-0 rounded-full
    bg-white/10 text-white/60
    hover:bg-orange-500 hover:text-grey-900
    cursor-pointer transition
    focus:outline-none focus:ring-2 focus:ring-orange-500"
  >4</button>

  <button
    type="button"
    class="rating-btn flex-1 aspect-square min-w-0 rounded-full
    bg-white/10 text-white/60
    hover:bg-orange-500 hover:text-grey-900
    cursor-pointer transition
    focus:outline-none focus:ring-2 focus:ring-orange-500"
  >5</button>
</div>

   <button   type="button"
  class="submit-btn bg-orange-500 w-full mt-5 py-1 
   rounded-full font-bold
   
   hover:bg-white hover:text-grey-900 cursor-pointer
     focus:outline-none focus:ring-2 focus:ring-white">SUBMIT</button>

    </article>

    <section  class="thankyou-rating-part text-center
     hidden ">

<img class=" mx-auto " src="/images/illustration-thank-you.svg"
 alt="">

<p
  class="selected-btn inline-block rounded-full px-4 py-2
    bg-white/10 text-orange-500 mt-4
    tracking-normal text-sm">
  
</p>


   <h2 class="text-white text-xl mt-4 font-overpass 
  ">
    Thank you!
  </h2>

  <p class="text-grey-500 text-[15px] mt-3 
  tracking-tight">
    We appreciate you taking the time to give a rating. If you ever need more support, 
  don’t hesitate to get in touch!
  </p>

</section>



  </main>
    
<script type="module" src="/src/main.js"></script>
  </body>
</html>
